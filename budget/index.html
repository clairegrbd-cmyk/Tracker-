<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Budget">
<meta name="theme-color" content="#E8F7EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1821" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<title>Budget de la semaine</title>
<style>
  :root {
    --ink: #0D1821;
    --slate: #344966;
    --berry: #B24C63;
    --mint: #E8F7EE;

    --bg: var(--mint);
    --surface: #ffffff;
    --text: var(--ink);
    --muted: #5f6f86;
    --line: #d3e4dc;
    --track: #dbe8e2;
    --primary: var(--slate);
    --on-primary: var(--mint);
    --accent: var(--berry);
    --accent-soft: #f6e3e8;
    --shadow: 0 1px 2px rgba(13, 24, 33, .05), 0 6px 18px rgba(13, 24, 33, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: var(--ink);
      --surface: #16263a;
      --text: var(--mint);
      --muted: #93a6bf;
      --line: #24364f;
      --track: #24364f;
      --primary: #8aa3c6;
      --on-primary: var(--ink);
      --accent: #d9728a;
      --accent-soft: #3a1f2b;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 110px);
    max-width: 560px; margin: 0 auto;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  .num { font-variant-numeric: tabular-nums; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 6px 0 20px; }
  .week-nav { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .week-label { min-width: 0; }
  .week-label small { display: block; font-size: 13px; color: var(--muted); }
  h1 { font-size: 24px; font-weight: 700; margin: 1px 0 0; letter-spacing: -.02em; white-space: nowrap; }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none;
    background: var(--surface); box-shadow: var(--shadow); color: var(--primary);
  }
  .icon-btn.ghost { background: none; box-shadow: none; width: 32px; }
  .icon-btn:disabled { opacity: .3; cursor: default; }
  .icon-btn svg { width: 20px; height: 20px; }

  .card { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); padding: 16px; }

  /* Résumé */
  .summary { background: var(--slate); color: var(--mint); padding: 18px 18px 20px; margin-bottom: 14px; }
  @media (prefers-color-scheme: dark) { .summary { background: #233650; } }
  .summary .label { font-size: 13px; opacity: .8; }
  .summary .big { font-size: 40px; font-weight: 750; letter-spacing: -.03em; margin: 2px 0 12px; }
  .summary.over .big { color: #ffb3c3; }
  .summary .bar { background: rgba(232, 247, 238, .2); }
  .summary .bar > i { background: var(--mint); }
  .summary.over .bar > i { background: #ffb3c3; }
  .summary .foot { display: flex; justify-content: space-between; font-size: 13px; opacity: .85; margin-top: 8px; }

  .bar { height: 8px; border-radius: 8px; background: var(--track); overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 8px; background: var(--primary); transition: width .35s ease; }

  /* Épargne */
  .savings { display: flex; align-items: center; gap: 14px; margin-bottom: 26px; width: 100%; text-align: left; }
  .savings .info { flex: 1; }
  .savings .title { font-weight: 650; }
  .savings .meta { font-size: 13px; color: var(--muted); }
  .savings .amount { font-size: 18px; font-weight: 700; color: var(--primary); }
  .tick {
    flex: none; width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--primary);
    display: grid; place-items: center; transition: background .2s, transform .15s;
  }
  .savings:active .tick { transform: scale(.88); }
  .tick svg { width: 18px; height: 18px; opacity: 0; color: var(--on-primary); transition: opacity .2s; }
  .savings.done .tick { background: var(--primary); }
  .savings.done .tick svg { opacity: 1; }
  .savings.done .meta { color: var(--primary); font-weight: 600; }

  h2 { font-size: 17px; margin: 0 4px 10px; font-weight: 650; display: flex; justify-content: space-between; align-items: baseline; }
  h2 span { font-size: 13px; color: var(--muted); font-weight: 500; }

  /* Catégories */
  .cats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 26px; }
  .cat { text-align: left; display: flex; flex-direction: column; gap: 8px; padding: 14px; transition: transform .15s; }
  .cat:active { transform: scale(.97); }
  .cat-top { display: flex; align-items: center; gap: 8px; }
  .cat .emoji { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; background: var(--bg); font-size: 17px; flex: none; }
  .cat .name { font-weight: 650; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cat .left { font-size: 20px; font-weight: 750; letter-spacing: -.02em; }
  .cat .left small { font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
  .cat .of { font-size: 12.5px; color: var(--muted); }
  .cat.over .left, .cat.over .of { color: var(--accent); }
  .cat.over .bar > i { background: var(--accent); }
  .cat.over { box-shadow: inset 0 0 0 1.5px var(--accent), var(--shadow); }

  /* Dépenses */
  .day { font-size: 12.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 14px 6px 6px; display: flex; justify-content: space-between; }
  .day:first-child { margin-top: 0; }
  .exp-list { padding: 4px 0; }
  .exp { display: flex; align-items: center; gap: 12px; padding: 10px 14px; width: 100%; text-align: left; }
  .exp + .exp { border-top: 1px solid var(--line); }
  .exp .emoji { font-size: 18px; width: 24px; text-align: center; flex: none; }
  .exp .info { flex: 1; min-width: 0; }
  .exp .note { font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .exp .catname { font-size: 12.5px; color: var(--muted); }
  .exp .amt { font-weight: 650; }
  .empty { color: var(--muted); font-size: 14px; text-align: center; padding: 22px; border: 1.5px dashed var(--line); border-radius: 18px; }

  .fab {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom) + 22px);
    background: var(--berry); color: #fff; font-weight: 650; padding: 15px 26px; border-radius: 30px;
    box-shadow: 0 8px 24px rgba(178, 76, 99, .35); display: flex; align-items: center; gap: 8px; white-space: nowrap;
  }
  .fab:active { transform: translateX(-50%) scale(.96); }
  .fab svg { width: 20px; height: 20px; }

  /* Feuilles */
  dialog {
    border: 0; padding: 0; width: 100%; max-width: 560px; margin: auto auto 0; border-radius: 24px 24px 0 0;
    background: var(--bg); color: var(--text); max-height: 92vh;
  }
  dialog::backdrop { background: rgba(13, 24, 33, .45); }
  .sheet { padding: 20px 18px calc(env(safe-area-inset-bottom) + 20px); }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .sheet-head h3 { margin: 0; font-size: 19px; }
  .link { color: var(--primary); font-weight: 600; font-size: 15px; }
  label.f { display: block; font-size: 13px; color: var(--muted); margin: 14px 2px 6px; font-weight: 600; }
  input[type=text], input[type=date], input.amount {
    width: 100%; font: inherit; color: var(--text); background: var(--surface); border: 1.5px solid var(--line);
    border-radius: 14px; padding: 12px 14px; outline: none; -webkit-appearance: none; appearance: none; min-height: 48px;
  }
  input:focus { border-color: var(--primary); }
  .amount-wrap { position: relative; }
  .amount-wrap input { font-size: 30px; font-weight: 700; padding-right: 44px; }
  .amount-wrap::after { content: "€"; position: absolute; right: 16px; top: 50%; transform: translateY(-50%); font-size: 24px; color: var(--muted); font-weight: 600; }
  .chips { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .chip { padding: 11px 12px; border-radius: 14px; background: var(--surface); border: 1.5px solid var(--line); font-weight: 600; font-size: 15px; display: flex; gap: 8px; align-items: center; }
  .chip[aria-pressed="true"] { border-color: var(--primary); background: var(--primary); color: var(--on-primary); }
  .hint { font-size: 12.5px; color: var(--muted); margin: 6px 2px 0; min-height: 1em; }
  .hint.warn { color: var(--accent); font-weight: 600; }
  .actions { display: flex; gap: 10px; margin-top: 22px; }
  .btn { flex: 1; padding: 14px; border-radius: 16px; font-weight: 650; text-align: center; }
  .btn.primary { background: var(--slate); color: var(--mint); }
  @media (prefers-color-scheme: dark) { .btn.primary { background: var(--mint); color: var(--ink); } }
  .btn.secondary { background: var(--surface); color: var(--primary); box-shadow: var(--shadow); }
  .btn.danger { background: var(--accent-soft); color: var(--accent); flex: 0 0 auto; padding: 14px 18px; }

  .row { display: flex; align-items: center; gap: 12px; background: var(--surface); border-radius: 14px; padding: 6px 6px 6px 14px; }
  .row + .row { margin-top: 8px; }
  .row .emoji { font-size: 18px; }
  .row input[type=text] { flex: 1; border: 0; padding: 8px 0; min-height: 40px; background: none; font-weight: 600; }
  .row .lim { width: 110px; flex: none; position: relative; }
  .row .lim input { text-align: right; padding: 8px 30px 8px 10px; min-height: 40px; font-weight: 700; }
  .row .lim::after { content: "€"; position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .total { display: flex; justify-content: space-between; margin: 12px 4px 0; font-size: 14px; color: var(--muted); }
  .total b { color: var(--text); }
  .tools { display: flex; gap: 10px; margin-top: 8px; }
</style>
</head>
<body>

<header>
  <div class="week-nav">
    <button class="icon-btn ghost" id="prev" aria-label="Semaine précédente">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="week-label">
      <small id="week-sub">Cette semaine</small>
      <h1 id="week-title">—</h1>
    </div>
    <button class="icon-btn ghost" id="next" aria-label="Semaine suivante">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>
  <button class="icon-btn" id="open-settings" aria-label="Réglages">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg>
  </button>
</header>

<section class="card summary" id="summary">
  <div class="label">Reste à dépenser cette semaine</div>
  <div class="big num" id="sum-left">0 €</div>
  <div class="bar"><i id="sum-bar"></i></div>
  <div class="foot num"><span id="sum-spent"></span><span id="sum-total"></span></div>
</section>

<button class="card savings" id="savings" aria-pressed="false">
  <span class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
  <span class="info">
    <span class="title">Épargne de la semaine</span><br>
    <span class="meta" id="sav-meta">À mettre de côté</span>
  </span>
  <span class="amount num" id="sav-amount">0 €</span>
</button>

<h2>Catégories <span>touche pour ajouter</span></h2>
<div class="cats" id="cats"></div>

<h2>Dépenses <span id="exp-count"></span></h2>
<div id="expenses"></div>

<button class="fab" id="add">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  Ajouter une dépense
</button>

<!-- Ajout / modification d'une dépense -->
<dialog id="exp-dialog">
  <form class="sheet" id="exp-form" method="dialog">
    <div class="sheet-head">
      <h3 id="exp-title">Nouvelle dépense</h3>
      <button type="button" class="link" data-close>Annuler</button>
    </div>
    <div class="amount-wrap">
      <input class="amount num" id="f-amount" inputmode="decimal" placeholder="0,00" autocomplete="off" required>
    </div>
    <label class="f">Catégorie</label>
    <div class="chips" id="f-cats"></div>
    <p class="hint" id="f-hint"></p>
    <label class="f" for="f-note">Description (facultatif)</label>
    <input type="text" id="f-note" placeholder="ex. Carrefour, pull, cadeau…" autocomplete="off">
    <label class="f" for="f-date">Date</label>
    <input type="date" id="f-date" required>
    <div class="actions">
      <button type="button" class="btn danger" id="f-delete" hidden>Supprimer</button>
      <button type="submit" class="btn primary">Enregistrer</button>
    </div>
  </form>
</dialog>

<!-- Réglages -->
<dialog id="settings">
  <form class="sheet" id="set-form" method="dialog">
    <div class="sheet-head">
      <h3>Réglages</h3>
      <button type="button" class="link" data-close>Annuler</button>
    </div>
    <label class="f">Limites par semaine</label>
    <div id="set-cats"></div>
    <div class="total num"><span>Budget total de la semaine</span><b id="set-total">0 €</b></div>
    <label class="f" for="set-sav">Épargne à mettre de côté chaque semaine</label>
    <div class="amount-wrap"><input class="amount num" id="set-sav" inputmode="decimal" placeholder="0"></div>
    <div class="actions"><button type="submit" class="btn primary">Enregistrer</button></div>
    <label class="f">Données (stockées sur ce téléphone)</label>
    <div class="tools">
      <button type="button" class="btn secondary" id="export">Sauvegarder</button>
      <button type="button" class="btn secondary" id="import">Restaurer</button>
      <input type="file" id="import-file" accept="application/json" hidden>
    </div>
  </form>
</dialog>

<script>
(() => {
  const STORE_KEY = 'budget-semaine-v1';
  const $ = s => document.querySelector(s);
  const DEFAULTS = {
    savings: 100,
    cats: [
      { id: 'courses',  name: 'Courses',  emoji: '🛒', limit: 120 },
      { id: 'shopping', name: 'Shopping', emoji: '🛍️', limit: 60 },
      { id: 'martin',   name: 'Martin',   emoji: '💙', limit: 40 },
      { id: 'autres',   name: 'Autres',   emoji: '✨', limit: 50 },
    ],
  };

  // ---------- état ----------
  let state = load();
  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(STORE_KEY));
      if (s && s.settings && Array.isArray(s.expenses)) return normalize(s);
    } catch (e) {}
    return { settings: structuredClone(DEFAULTS), expenses: [], saved: {} };
  }
  function normalize(s) {
    s.saved = s.saved || {};
    s.settings.savings = Number(s.settings.savings) || 0;
    // garde toujours les 4 catégories, dans l'ordre
    s.settings.cats = DEFAULTS.cats.map(d => ({ ...d, ...(s.settings.cats || []).find(c => c.id === d.id) }));
    return s;
  }
  function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }

  // ---------- dates ----------
  const pad = n => String(n).padStart(2, '0');
  const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parseIso = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const mondayOf = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); return addDays(x, -((x.getDay() + 6) % 7)); };
  const today = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };

  let weekStart = mondayOf(today());

  // ---------- format ----------
  const eur0 = new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
  const eur2 = new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR', minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const money = n => { const r = Math.round(n * 100) / 100; return (Number.isInteger(r) ? eur0 : eur2).format(r); };
  const parseAmount = s => { const n = parseFloat(String(s).replace(/\s/g, '').replace(',', '.')); return isFinite(n) ? Math.round(n * 100) / 100 : NaN; };
  const dayFmt = new Intl.DateTimeFormat('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
  const shortFmt = new Intl.DateTimeFormat('fr-FR', { day: 'numeric', month: 'short' });
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const catById = id => state.settings.cats.find(c => c.id === id) || state.settings.cats[3];

  function weekExpenses(start = weekStart) {
    const a = iso(start), b = iso(addDays(start, 6));
    return state.expenses.filter(e => e.date >= a && e.date <= b);
  }
  function spentIn(list, catId) { return list.filter(e => e.cat === catId).reduce((s, e) => s + e.amount, 0); }

  // ---------- rendu ----------
  function render() {
    const ws = iso(weekStart), cur = iso(mondayOf(today()));
    const end = addDays(weekStart, 6);
    const diff = Math.round((weekStart - mondayOf(today())) / 864e5 / 7);
    $('#week-sub').textContent = diff === 0 ? 'Cette semaine' : diff === -1 ? 'Semaine dernière' : diff === 1 ? 'Semaine prochaine' : diff < 0 ? `Il y a ${-diff} semaines` : `Dans ${diff} semaines`;
    $('#week-title').textContent = `${shortFmt.format(weekStart).replace('.', '')} – ${shortFmt.format(end).replace('.', '')}`;
    $('#next').disabled = ws >= cur;

    const list = weekExpenses();
    const total = state.settings.cats.reduce((s, c) => s + c.limit, 0);
    const spent = list.reduce((s, e) => s + e.amount, 0);
    const left = total - spent;

    $('#summary').classList.toggle('over', left < 0);
    $('#sum-left').textContent = left < 0 ? `− ${money(-left)}` : money(left);
    $('#sum-bar').style.width = (total ? Math.min(100, spent / total * 100) : 0) + '%';
    $('#sum-spent').textContent = `${money(spent)} dépensés`;
    $('#sum-total').textContent = `sur ${money(total)}`;

    const done = !!state.saved[ws];
    const sav = $('#savings');
    sav.classList.toggle('done', done);
    sav.setAttribute('aria-pressed', done);
    $('#sav-amount').textContent = money(state.settings.savings);
    $('#sav-meta').textContent = done ? 'Mis de côté ✓' : 'À mettre de côté — coche quand c\'est fait';

    $('#cats').innerHTML = state.settings.cats.map(c => {
      const s = spentIn(list, c.id), r = c.limit - s, over = r < 0;
      const pct = c.limit ? Math.min(100, s / c.limit * 100) : (s > 0 ? 100 : 0);
      return `<button class="card cat${over ? ' over' : ''}" data-cat="${c.id}">
        <span class="cat-top"><span class="emoji">${c.emoji}</span><span class="name">${esc(c.name)}</span></span>
        <span class="left num">${over ? '− ' + money(-r) : money(r)} <small>${over ? 'de trop' : 'restant'}</small></span>
        <span class="bar"><i style="width:${pct}%"></i></span>
        <span class="of num">${money(s)} / ${money(c.limit)}</span>
      </button>`;
    }).join('');

    $('#exp-count').textContent = list.length ? `${list.length} dépense${list.length > 1 ? 's' : ''}` : '';
    if (!list.length) {
      $('#expenses').innerHTML = `<div class="empty">Aucune dépense ${diff === 0 ? 'pour l\'instant cette semaine' : 'cette semaine-là'}.</div>`;
    } else {
      const byDay = {};
      [...list].sort((a, b) => b.date.localeCompare(a.date) || b.created - a.created).forEach(e => (byDay[e.date] = byDay[e.date] || []).push(e));
      $('#expenses').innerHTML = Object.entries(byDay).map(([d, items]) => `
        <div class="day"><span>${dayFmt.format(parseIso(d))}</span><span class="num">${money(items.reduce((s, e) => s + e.amount, 0))}</span></div>
        <div class="card exp-list" style="padding:0">${items.map(e => {
          const c = catById(e.cat);
          return `<button class="exp" data-id="${e.id}">
            <span class="emoji">${c.emoji}</span>
            <span class="info"><div class="note">${esc(e.note || c.name)}</div>${e.note ? `<div class="catname">${esc(c.name)}</div>` : ''}</span>
            <span class="amt num">${money(e.amount)}</span>
          </button>`;
        }).join('')}</div>`).join('');
    }
  }

  // ---------- navigation ----------
  $('#prev').addEventListener('click', () => { weekStart = addDays(weekStart, -7); render(); });
  $('#next').addEventListener('click', () => { weekStart = addDays(weekStart, 7); render(); });

  $('#savings').addEventListener('click', () => {
    const ws = iso(weekStart);
    if (state.saved[ws]) delete state.saved[ws]; else state.saved[ws] = true;
    save(); render();
  });

  document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => b.closest('dialog').close()));
  document.querySelectorAll('dialog').forEach(d => d.addEventListener('click', e => { if (e.target === d) d.close(); }));

  // ---------- dépense ----------
  const expDialog = $('#exp-dialog');
  let editingId = null, selCat = 'courses';

  function updateHint() {
    const c = catById(selCat);
    const d = $('#f-date').value || iso(today());
    const list = weekExpenses(mondayOf(parseIso(d))).filter(e => e.id !== editingId);
    const amt = parseAmount($('#f-amount').value) || 0;
    const r = c.limit - spentIn(list, c.id);
    const after = r - amt;
    const h = $('#f-hint');
    h.classList.toggle('warn', after < 0);
    h.textContent = after < 0
      ? `Attention : ${money(-after)} au-dessus de la limite ${c.name}`
      : `Il restera ${money(after)} en ${c.name} cette semaine`;
  }
  function renderChips() {
    $('#f-cats').innerHTML = state.settings.cats.map(c =>
      `<button type="button" class="chip" data-cat="${c.id}" aria-pressed="${c.id === selCat}"><span>${c.emoji}</span>${esc(c.name)}</button>`).join('');
  }
  $('#f-cats').addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b) return;
    selCat = b.dataset.cat; renderChips(); updateHint();
  });
  $('#f-amount').addEventListener('input', updateHint);
  $('#f-date').addEventListener('change', updateHint);

  function openExpense(exp, cat) {
    editingId = exp ? exp.id : null;
    selCat = exp ? exp.cat : (cat || selCat);
    $('#exp-title').textContent = exp ? 'Modifier la dépense' : 'Nouvelle dépense';
    $('#f-amount').value = exp ? String(exp.amount).replace('.', ',') : '';
    $('#f-note').value = exp ? exp.note || '' : '';
    const t = today();
    const defaultDate = (t >= weekStart && t <= addDays(weekStart, 6)) ? t : addDays(weekStart, 6);
    $('#f-date').value = exp ? exp.date : iso(defaultDate);
    $('#f-delete').hidden = !exp;
    renderChips(); updateHint();
    expDialog.showModal();
    if (!exp) setTimeout(() => $('#f-amount').focus(), 60);
  }

  $('#add').addEventListener('click', () => openExpense(null));
  $('#cats').addEventListener('click', e => { const b = e.target.closest('.cat'); if (b) openExpense(null, b.dataset.cat); });
  $('#expenses').addEventListener('click', e => {
    const b = e.target.closest('.exp'); if (!b) return;
    openExpense(state.expenses.find(x => x.id === b.dataset.id));
  });

  $('#exp-form').addEventListener('submit', e => {
    e.preventDefault();
    const amount = parseAmount($('#f-amount').value);
    if (!(amount > 0)) { $('#f-amount').focus(); $('#f-amount').select(); return; }
    const data = { amount, cat: selCat, note: $('#f-note').value.trim(), date: $('#f-date').value || iso(today()) };
    if (editingId) Object.assign(state.expenses.find(x => x.id === editingId), data);
    else state.expenses.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), created: Date.now(), ...data });
    weekStart = mondayOf(parseIso(data.date));
    save(); render(); expDialog.close();
  });
  $('#f-delete').addEventListener('click', () => {
    if (!editingId || !confirm('Supprimer cette dépense ?')) return;
    state.expenses = state.expenses.filter(x => x.id !== editingId);
    save(); render(); expDialog.close();
  });

  // ---------- réglages ----------
  const setDialog = $('#settings');
  function setTotal() {
    const t = [...document.querySelectorAll('#set-cats .lim input')].reduce((s, i) => s + (parseAmount(i.value) || 0), 0);
    $('#set-total').textContent = money(t);
  }
  $('#open-settings').addEventListener('click', () => {
    $('#set-cats').innerHTML = state.settings.cats.map(c => `
      <div class="row" data-id="${c.id}">
        <span class="emoji">${c.emoji}</span>
        <input type="text" value="${esc(c.name)}" aria-label="Nom de la catégorie" maxlength="20">
        <span class="lim"><input class="amount num" inputmode="decimal" value="${String(c.limit).replace('.', ',')}" aria-label="Limite ${esc(c.name)}"></span>
      </div>`).join('');
    $('#set-sav').value = String(state.settings.savings).replace('.', ',');
    setTotal();
    setDialog.showModal();
  });
  $('#set-cats').addEventListener('input', setTotal);
  $('#set-form').addEventListener('submit', e => {
    e.preventDefault();
    document.querySelectorAll('#set-cats .row').forEach(r => {
      const c = state.settings.cats.find(x => x.id === r.dataset.id);
      c.name = r.querySelector('input[type=text]').value.trim() || DEFAULTS.cats.find(d => d.id === c.id).name;
      c.limit = Math.max(0, parseAmount(r.querySelector('.lim input').value) || 0);
    });
    state.settings.savings = Math.max(0, parseAmount($('#set-sav').value) || 0);
    save(); render(); setDialog.close();
  });

  $('#export').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `budget-${iso(today())}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });
  $('#import').addEventListener('click', () => $('#import-file').click());
  $('#import-file').addEventListener('change', async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const s = JSON.parse(await f.text());
      if (!s.settings || !Array.isArray(s.expenses)) throw 0;
      if (!confirm('Remplacer les données actuelles par cette sauvegarde ?')) return;
      state = normalize(s); save(); render(); setDialog.close();
    } catch (err) { alert('Fichier de sauvegarde invalide.'); }
    e.target.value = '';
  });

  // nouvelle semaine : si l'appli reste ouverte, on se recale au retour
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') render();
  });

  render();

  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
