<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Listes">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<title>Listes</title>
<style>
  :root {
    --bg: #f2f2f7;
    --page: #ffffff;
    --surface: #ffffff;
    --text: #1c1c1e;
    --muted: #8e8e93;
    --line: #e5e5ea;
    --circle: #c7c7cc;
    --blue: #007aff;
    --red: #ff3b30;
    --fill: #f2f2f7;
    --backdrop: rgba(0,0,0,.32);
    --c: #007aff; /* couleur de la liste courante */
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --page: #000000;
      --surface: #1c1c1e;
      --text: #f2f2f7;
      --muted: #8e8e93;
      --line: #2c2c2e;
      --circle: #48484a;
      --blue: #0a84ff;
      --red: #ff453a;
      --fill: #2c2c2e;
      --backdrop: rgba(0,0,0,.55);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  html.on-list, html.on-list body { background: var(--page); }
  body {
    font: 17px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: none; user-select: none;
  }
  input { -webkit-user-select: text; user-select: text; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  input { font: inherit; color: inherit; background: none; border: 0; outline: none; padding: 0; margin: 0; min-width: 0; }
  input::placeholder { color: var(--muted); }
  svg { display: block; }

  #app {
    max-width: 600px; margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 6px) 16px calc(env(safe-area-inset-bottom) + 96px);
  }

  /* Barre de navigation */
  .nav { display: flex; align-items: center; justify-content: space-between; height: 44px; }
  .nav-back { display: flex; align-items: center; gap: 2px; color: var(--c); font-size: 17px; margin-left: -6px; }
  .nav-back svg { width: 24px; height: 24px; }
  .nav-right { display: flex; align-items: center; gap: 14px; margin-left: auto; }
  .round-btn {
    width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
    border: 1.8px solid var(--c); color: var(--c);
  }
  .round-btn svg { width: 16px; height: 16px; }
  .plain-btn { color: var(--c); font-weight: 600; font-size: 17px; }

  h1.title { font-size: 34px; font-weight: 700; letter-spacing: -.02em; margin: 2px 0 6px; color: var(--c); line-height: 1.15; word-break: break-word; }
  h1.home-title { color: var(--text); }

  /* Progression */
  .progress { display: flex; align-items: center; gap: 10px; margin: 2px 0 14px; color: var(--muted); font-size: 14px; }
  .progress .track { flex: 1; height: 5px; background: var(--fill); border-radius: 5px; overflow: hidden; }
  .progress .track i { display: block; height: 100%; background: var(--c); border-radius: 5px; transition: width .3s ease; }

  .done-banner {
    display: flex; align-items: center; gap: 12px; padding: 12px 14px; margin: 0 0 14px;
    border-radius: 14px; background: color-mix(in srgb, var(--c) 12%, var(--page));
  }
  .done-banner[hidden] { display: none; }
  .done-banner .em { font-size: 26px; }
  .done-banner b { display: block; font-size: 16px; }
  .done-banner small { color: var(--muted); font-size: 13px; }
  .done-banner button { margin-left: auto; background: var(--c); color: #fff; font-weight: 600; font-size: 15px; padding: 8px 14px; border-radius: 20px; white-space: nowrap; }

  /* Chapitres */
  .sec { margin-top: 10px; }
  .sec-head { display: flex; align-items: center; gap: 8px; padding: 14px 0 4px; }
  .sec-head h2 { font-size: 21px; font-weight: 700; margin: 0; color: var(--c); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .sec-head .cnt { color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; }
  .sec-head .chev { width: 18px; height: 18px; color: var(--muted); transition: transform .2s; }
  .sec.collapsed .chev { transform: rotate(-90deg); }
  .sec.collapsed ul { display: none; }
  .sec-head input.sec-title-in { font-size: 21px; font-weight: 700; color: var(--c); flex: 1; }

  ul.items { list-style: none; margin: 0; padding: 0; }
  .item { display: flex; align-items: flex-start; gap: 12px; padding: 0; min-height: 46px; cursor: pointer; }
  .item .check {
    flex: none; width: 23px; height: 23px; margin-top: 11px; border-radius: 50%;
    border: 1.6px solid var(--circle); position: relative; transition: border-color .15s;
  }
  .item.done .check { border-color: var(--c); }
  .item.done .check::after {
    content: ""; position: absolute; inset: 2.5px; border-radius: 50%; background: var(--c);
    animation: pop .22s ease;
  }
  @keyframes pop { from { transform: scale(.3); } to { transform: scale(1); } }
  .item .body { flex: 1; min-width: 0; padding: 12px 0 12px; border-bottom: .5px solid var(--line); display: flex; align-items: center; gap: 8px; }
  .item .txt { flex: 1; min-width: 0; word-break: break-word; transition: color .15s; }
  .item.done .txt { color: var(--muted); }
  .item .note { color: var(--muted); font-size: 14px; }
  .hide-done .item.done:not(.just) { display: none; }
  .item.just { animation: fadeout .9s ease forwards; }
  .hide-done .item.done.just { animation: fadeout .9s ease forwards; }
  @keyframes fadeout { 0%,60% { opacity: 1; } 100% { opacity: .35; } }

  .add-row { display: flex; align-items: center; gap: 12px; min-height: 46px; cursor: text; }
  .add-row .plus { flex: none; width: 23px; height: 23px; display: grid; place-items: center; color: var(--muted); }
  .add-row .plus svg { width: 20px; height: 20px; }
  .add-row .body { flex: 1; padding: 12px 0; }
  .add-row input { width: 100%; }

  /* Mode édition */
  .item.edit { cursor: default; align-items: center; }
  .item.edit .body { padding: 8px 0; }
  .item.edit input { flex: 1; padding: 4px 0; }
  .mini { width: 30px; height: 30px; display: grid; place-items: center; color: var(--muted); border-radius: 8px; flex: none; }
  .mini svg { width: 18px; height: 18px; }
  .mini:disabled { opacity: .25; }
  .del-btn { width: 23px; height: 23px; border-radius: 50%; background: var(--red); color: #fff; display: grid; place-items: center; flex: none; }
  .del-btn svg { width: 14px; height: 14px; }

  .add-sec-btn { display: flex; align-items: center; gap: 8px; margin: 22px 0 0; color: var(--c); font-weight: 600; font-size: 16px; }
  .add-sec-btn svg { width: 20px; height: 20px; }

  .empty { text-align: center; color: var(--muted); padding: 60px 20px 20px; }
  .empty .big { font-size: 46px; margin-bottom: 8px; }

  /* Accueil */
  .group { background: var(--surface); border-radius: 12px; overflow: hidden; margin-top: 8px; }
  .lrow { display: flex; align-items: center; gap: 12px; padding: 0 0 0 14px; width: 100%; text-align: left; }
  .lrow .ic { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 18px; background: var(--lc); }
  .lrow .body { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; padding: 14px 14px 14px 0; border-bottom: .5px solid var(--line); }
  .lrow:last-child .body { border-bottom: 0; }
  .lrow .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lrow .meta { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 16px; }
  .lrow .ok { color: #34c759; font-size: 15px; }
  .lrow .go { width: 14px; height: 14px; color: var(--circle); }
  .section-label { font-size: 22px; font-weight: 700; margin: 22px 2px 6px; }

  /* Barre du bas */
  .toolbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    padding: 10px 16px calc(env(safe-area-inset-bottom) + 10px);
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  }
  html.on-list .toolbar { background: color-mix(in srgb, var(--page) 82%, transparent); }
  .toolbar .in { max-width: 600px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 0 2px; }
  .tb-btn { display: flex; align-items: center; gap: 8px; color: var(--c); font-weight: 600; font-size: 17px; }
  .tb-btn svg { width: 24px; height: 24px; }
  .tb-btn.light { font-weight: 500; font-size: 16px; }

  /* Feuilles (modales) */
  .backdrop { position: fixed; inset: 0; background: var(--backdrop); z-index: 20; opacity: 0; transition: opacity .2s; }
  .backdrop.show { opacity: 1; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; margin: 0 auto; max-width: 600px;
    background: var(--bg); border-radius: 14px 14px 0 0;
    padding: 0 16px calc(env(safe-area-inset-bottom) + 18px);
    transform: translateY(100%); transition: transform .28s cubic-bezier(.2,.8,.2,1);
    max-height: 92vh; overflow: auto;
  }
  .sheet.show { transform: none; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; height: 54px; position: sticky; top: 0; background: var(--bg); z-index: 1; }
  .sheet-head b { font-size: 17px; }
  .sheet-head button { color: var(--blue); font-size: 17px; min-width: 70px; }
  .sheet-head button.ok { font-weight: 600; text-align: right; }
  .sheet-head button.ok:disabled { opacity: .35; }
  .preview { display: grid; place-items: center; padding: 8px 0 18px; }
  .preview .ic { width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; font-size: 42px; background: var(--lc); box-shadow: 0 6px 18px color-mix(in srgb, var(--lc) 45%, transparent); }
  .field { background: var(--surface); border-radius: 12px; padding: 12px 14px; }
  .field input { width: 100%; font-size: 20px; font-weight: 600; text-align: center; }
  .field + .field { margin-top: 14px; }
  .swatches { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; justify-items: center; }
  .swatch { width: 38px; height: 38px; border-radius: 50%; position: relative; }
  .swatch[aria-pressed="true"]::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 3px solid color-mix(in srgb, var(--muted) 55%, transparent); }
  .emojis { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; justify-items: center; }
  .emoji { width: 42px; height: 42px; border-radius: 50%; font-size: 22px; display: grid; place-items: center; background: var(--fill); }
  .emoji[aria-pressed="true"] { box-shadow: 0 0 0 3px color-mix(in srgb, var(--muted) 55%, transparent); }

  .actions { display: flex; flex-direction: column; gap: 8px; padding-top: 16px; }
  .actions .grp { background: var(--surface); border-radius: 14px; overflow: hidden; }
  .actions .grp-title { text-align: center; color: var(--muted); font-size: 13px; padding: 14px 16px 10px; border-bottom: .5px solid var(--line); }
  .actions .act { display: flex; align-items: center; gap: 12px; width: 100%; padding: 15px 18px; font-size: 17px; border-bottom: .5px solid var(--line); text-align: left; color: var(--text); }
  .actions .act:last-child { border-bottom: 0; }
  .actions .act .e { width: 24px; text-align: center; }
  .actions .act.danger { color: var(--red); }
  .actions .act.primary { color: var(--blue); font-weight: 600; justify-content: center; }
  .actions .cancel { background: var(--surface); border-radius: 14px; padding: 15px; font-weight: 600; color: var(--blue); width: 100%; font-size: 17px; }

  .toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 70px); z-index: 30;
    transform: translate(-50%, 20px); opacity: 0; pointer-events: none; transition: .25s;
    background: #1c1c1e; color: #fff; border-radius: 14px; padding: 11px 14px 11px 16px;
    display: flex; align-items: center; gap: 14px; font-size: 15px; white-space: nowrap; box-shadow: 0 6px 24px rgba(0,0,0,.25);
  }
  @media (prefers-color-scheme: dark) { .toast { background: #3a3a3c; } }
  .toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .toast button { color: #64d2ff; font-weight: 600; }
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
(() => {
  'use strict';

  const STORE_KEY = 'listes-v1';
  const COLORS = [
    ['bleu', '#007aff'], ['violet', '#af52de'], ['rose', '#ff2d55'], ['rouge', '#ff3b30'],
    ['orange', '#ff9500'], ['jaune', '#e0a800'], ['vert', '#34c759'], ['menthe', '#00b8a9'],
    ['ciel', '#32ade6'], ['indigo', '#5856d6'], ['brun', '#a2845e'], ['gris', '#8e8e93'],
  ];
  const EMOJIS = ['🧳','🛒','👶','🍼','🧸','🎒','🏖️','⛺','⛷️','✈️','🚗','🏠',
                  '🎉','🎄','🎁','🐶','💊','🧺','🍽️','🥕','📚','💼','⭐','📝'];

  const I = {
    back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
    more: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>',
    reset: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg>',
    plusCircle: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="currentColor"/><path d="M12 7v10M7 12h10" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>',
    plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
    chev: '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
    go: '<svg class="go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
    up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>',
    down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
    minus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M6 12h12"/></svg>',
    folder: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 11v5M9.5 13.5h5"/></svg>',
  };

  // ---------- Données ----------
  const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function mkList(name, emoji, color, sections) {
    return {
      id: uid(), name, emoji, color, hideDone: false,
      sections: sections.map(([title, items]) => ({
        id: uid(), title, collapsed: false,
        items: items.map(text => ({ id: uid(), text, done: false })),
      })),
    };
  }
  function seed() {
    return {
      lists: [
        mkList('Week-end chez Mamie', '👶', '#af52de', [
          ['Repas', ['Bavoir', 'Biberon', 'Lait']],
          ['Dodo', ['Gigoteuse', 'Doudou', 'Tétine']],
          ['Toilette', ['Couches', 'Lingettes', 'Crème']],
          ['Vêtements', ['Pyjama', 'Bodies', 'Chaussettes']],
        ]),
        mkList('Courses', '🛒', '#34c759', [
          ['Frais', ['Lait', 'Yaourts', 'Fromage']],
          ['Épicerie', ['Pâtes', 'Café']],
        ]),
      ],
    };
  }
  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(STORE_KEY));
      if (s && Array.isArray(s.lists)) return s;
    } catch (e) {}
    return seed();
  }
  let state = load();
  function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }

  const getList = id => state.lists.find(l => l.id === id);
  const stats = l => {
    let total = 0, done = 0;
    l.sections.forEach(s => s.items.forEach(i => { total++; if (i.done) done++; }));
    return { total, done };
  };
  function move(arr, idx, dir) {
    const j = idx + dir;
    if (j < 0 || j >= arr.length) return;
    [arr[idx], arr[j]] = [arr[j], arr[idx]];
  }

  // ---------- Interface ----------
  const app = document.getElementById('app');
  const ui = { edit: false, homeEdit: false };

  function currentListId() {
    const m = location.hash.match(/^#\/l\/(.+)$/);
    return m && getList(m[1]) ? m[1] : null;
  }

  function render() {
    const id = currentListId();
    if (id) renderList(getList(id)); else renderHome();
  }

  function renderHome() {
    document.documentElement.classList.remove('on-list');
    document.documentElement.style.setProperty('--c', 'var(--blue)');
    const rows = state.lists.map((l, i) => {
      const { total, done } = stats(l);
      const meta = total && done === total ? '<span class="ok">Prête ✓</span>'
        : `<span class="meta">${total ? done + '/' + total : '0'}</span>`;
      if (ui.homeEdit) {
        return `<div class="lrow" style="--lc:${l.color}">
          <span class="ic">${esc(l.emoji)}</span>
          <span class="body"><span class="name">${esc(l.name)}</span>
            <button class="mini" data-act="list-up" data-i="${i}" ${i === 0 ? 'disabled' : ''} aria-label="Monter">${I.up}</button>
            <button class="mini" data-act="list-down" data-i="${i}" ${i === state.lists.length - 1 ? 'disabled' : ''} aria-label="Descendre">${I.down}</button>
          </span></div>`;
      }
      return `<button class="lrow" style="--lc:${l.color}" data-act="open" data-id="${l.id}">
        <span class="ic">${esc(l.emoji)}</span>
        <span class="body"><span class="name">${esc(l.name)}</span>${meta}${I.go}</span>
      </button>`;
    }).join('');

    app.innerHTML = `
      <div class="nav">
        <div class="nav-right">
          ${ui.homeEdit
            ? '<button class="plain-btn" data-act="home-edit-done">OK</button>'
            : `<button class="round-btn" data-act="home-menu" aria-label="Options">${I.more}</button>`}
        </div>
      </div>
      <h1 class="title home-title">Mes listes</h1>
      ${state.lists.length ? `<div class="group">${rows}</div>` : `
        <div class="empty"><div class="big">🧳</div>Aucune liste pour l'instant.<br>Crée ta première liste de valise ou de courses.</div>`}
    `;
    toolbar(`<button class="tb-btn" data-act="new-list">${I.plusCircle}Nouvelle liste</button>`);
  }

  function itemHTML(l, s, it, idx) {
    if (ui.edit) {
      return `<li class="item edit" data-id="${it.id}" data-sec="${s.id}">
        <button class="del-btn" data-act="del-item" aria-label="Supprimer">${I.minus}</button>
        <span class="body">
          <input class="item-in" value="${esc(it.text)}" data-id="${it.id}" data-sec="${s.id}" enterkeyhint="done">
          <button class="mini" data-act="item-up" ${idx === 0 ? 'disabled' : ''} aria-label="Monter">${I.up}</button>
          <button class="mini" data-act="item-down" ${idx === s.items.length - 1 ? 'disabled' : ''} aria-label="Descendre">${I.down}</button>
        </span></li>`;
    }
    return `<li class="item${it.done ? ' done' : ''}" data-act="toggle" data-id="${it.id}" data-sec="${s.id}" role="checkbox" aria-checked="${it.done}">
      <span class="check"></span>
      <span class="body"><span class="txt">${esc(it.text)}</span></span>
    </li>`;
  }

  function sectionHTML(l, s, si) {
    const done = s.items.filter(i => i.done).length;
    let head = '';
    if (ui.edit) {
      head = `<div class="sec-head">
        <input class="sec-title-in" value="${esc(s.title)}" placeholder="Titre du chapitre" data-sec="${s.id}" enterkeyhint="done">
        <button class="mini" data-act="sec-up" data-sec="${s.id}" ${si === 0 ? 'disabled' : ''} aria-label="Monter">${I.up}</button>
        <button class="mini" data-act="sec-down" data-sec="${s.id}" ${si === l.sections.length - 1 ? 'disabled' : ''} aria-label="Descendre">${I.down}</button>
        <button class="del-btn" data-act="del-sec" data-sec="${s.id}" aria-label="Supprimer le chapitre">${I.minus}</button>
      </div>`;
    } else if (s.title) {
      head = `<div class="sec-head" data-act="collapse" data-sec="${s.id}">
        <h2>${esc(s.title)}</h2><span class="cnt">${s.items.length ? done + '/' + s.items.length : ''}</span>${I.chev}
      </div>`;
    }
    const collapsed = s.collapsed && s.title && !ui.edit;
    return `<section class="sec${collapsed ? ' collapsed' : ''}" data-sec="${s.id}">
      ${head}
      <ul class="items">
        ${s.items.map((it, idx) => itemHTML(l, s, it, idx)).join('')}
        <li class="add-row" data-act="focus-add">
          <span class="plus">${I.plus}</span>
          <span class="body"><input class="add-in" data-sec="${s.id}" placeholder="Ajouter${s.title ? ' dans « ' + esc(s.title) + ' »' : ' un élément'}" enterkeyhint="next" autocomplete="off" autocorrect="on"></span>
        </li>
      </ul>
    </section>`;
  }

  function renderList(l) {
    document.documentElement.classList.add('on-list');
    document.documentElement.style.setProperty('--c', l.color);
    app.innerHTML = `
      <div class="nav">
        <button class="nav-back" data-act="home">${I.back}Listes</button>
        <div class="nav-right">
          ${ui.edit
            ? '<button class="plain-btn" data-act="edit-done">OK</button>'
            : `<button class="round-btn" data-act="reset" aria-label="Réinitialiser">${I.reset}</button>
               <button class="round-btn" data-act="list-menu" aria-label="Options">${I.more}</button>`}
        </div>
      </div>
      <h1 class="title">${esc(l.name)}</h1>
      <div class="progress"><span class="track"><i id="pbar"></i></span><span id="ptxt"></span></div>
      <div class="done-banner" id="banner" hidden>
        <span class="em">✨</span>
        <span><b>Tout est prêt !</b><small>Remets à zéro pour la prochaine fois.</small></span>
        <button data-act="reset">Réinitialiser</button>
      </div>
      <div id="secs" class="${l.hideDone && !ui.edit ? 'hide-done' : ''}">
        ${l.sections.map((s, si) => sectionHTML(l, s, si)).join('')}
      </div>
      ${!l.sections.length ? '<div class="empty"><div class="big">📝</div>Liste vide.<br>Ajoute un élément ou un chapitre.</div>' : ''}
      <button class="add-sec-btn" data-act="new-sec">${I.folder}Nouveau chapitre</button>
    `;
    toolbar(`<button class="tb-btn" data-act="new-item">${I.plusCircle}Nouvel élément</button>
             <button class="tb-btn light" data-act="${ui.edit ? 'edit-done' : 'edit'}">${ui.edit ? 'OK' : 'Modifier'}</button>`);
    updateCounts(l);
  }

  function updateCounts(l) {
    const { total, done } = stats(l);
    const bar = document.getElementById('pbar'), txt = document.getElementById('ptxt');
    if (!bar) return;
    bar.style.width = total ? (done / total * 100) + '%' : '0';
    txt.textContent = total ? `${done} sur ${total}` : '';
    document.getElementById('banner').hidden = !(total && done === total) || ui.edit;
    l.sections.forEach(s => {
      const c = app.querySelector(`.sec[data-sec="${s.id}"] .cnt`);
      if (c) c.textContent = s.items.length ? s.items.filter(i => i.done).length + '/' + s.items.length : '';
    });
  }

  let tbEl;
  function toolbar(html) {
    if (!tbEl) { tbEl = document.createElement('div'); tbEl.className = 'toolbar'; document.body.appendChild(tbEl); }
    tbEl.innerHTML = `<div class="in">${html}</div>`;
  }

  // ---------- Feuilles ----------
  let sheetEls = null;
  function openSheet(html, onMount) {
    closeSheet(true);
    const bd = document.createElement('div'); bd.className = 'backdrop';
    const sh = document.createElement('div'); sh.className = 'sheet'; sh.innerHTML = html;
    document.body.append(bd, sh);
    bd.addEventListener('click', () => closeSheet());
    sheetEls = { bd, sh };
    requestAnimationFrame(() => { bd.classList.add('show'); sh.classList.add('show'); });
    if (onMount) onMount(sh);
    return sh;
  }
  function closeSheet(now) {
    if (!sheetEls) return;
    const { bd, sh } = sheetEls; sheetEls = null;
    if (now) { bd.remove(); sh.remove(); return; }
    bd.classList.remove('show'); sh.classList.remove('show');
    setTimeout(() => { bd.remove(); sh.remove(); }, 300);
  }

  function actionSheet(title, actions) {
    const sh = openSheet(`<div class="actions">
      <div class="grp">
        ${title ? `<div class="grp-title">${esc(title)}</div>` : ''}
        ${actions.map((a, i) => `<button class="act${a.danger ? ' danger' : ''}${a.primary ? ' primary' : ''}" data-i="${i}">${a.e ? `<span class="e">${a.e}</span>` : ''}${esc(a.label)}</button>`).join('')}
      </div>
      <button class="cancel">Annuler</button>
    </div>`);
    sh.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      closeSheet();
      if (b.dataset.i != null) actions[+b.dataset.i].fn();
    });
  }

  function promptSheet(title, placeholder, value, onOk) {
    const sh = openSheet(`
      <div class="sheet-head"><button data-x="cancel">Annuler</button><b>${esc(title)}</b><button class="ok" data-x="ok">OK</button></div>
      <div class="field"><input id="pIn" placeholder="${esc(placeholder)}" value="${esc(value || '')}" enterkeyhint="done"></div>
      <div style="height:8px"></div>`);
    const inp = sh.querySelector('#pIn');
    const ok = () => { const v = inp.value.trim(); if (!v) return; closeSheet(); onOk(v); };
    sh.addEventListener('click', e => {
      const x = e.target.closest('[data-x]')?.dataset.x;
      if (x === 'cancel') closeSheet(); else if (x === 'ok') ok();
    });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') ok(); });
    inp.focus();
  }

  function listEditor(existing) {
    const d = existing
      ? { name: existing.name, emoji: existing.emoji, color: existing.color }
      : { name: '', emoji: '🧳', color: COLORS[0][1] };
    const sh = openSheet(`
      <div class="sheet-head"><button data-x="cancel">Annuler</button><b>${existing ? 'Infos de la liste' : 'Nouvelle liste'}</b><button class="ok" data-x="ok">OK</button></div>
      <div class="preview"><span class="ic" id="pv"></span></div>
      <div class="field"><input id="nameIn" placeholder="Nom de la liste" value="${esc(d.name)}" enterkeyhint="done" autocomplete="off"></div>
      <div class="field"><div class="swatches">${COLORS.map(([n, c]) => `<button class="swatch" style="background:${c}" data-color="${c}" aria-label="${n}"></button>`).join('')}</div></div>
      <div class="field"><div class="emojis">${EMOJIS.map(e => `<button class="emoji" data-emoji="${e}">${e}</button>`).join('')}</div></div>
    `);
    const nameIn = sh.querySelector('#nameIn'), okBtn = sh.querySelector('.ok'), pv = sh.querySelector('#pv');
    const sync = () => {
      pv.textContent = d.emoji; sh.style.setProperty('--lc', d.color);
      nameIn.style.color = d.color;
      sh.querySelectorAll('.swatch').forEach(b => b.setAttribute('aria-pressed', b.dataset.color === d.color));
      sh.querySelectorAll('.emoji').forEach(b => b.setAttribute('aria-pressed', b.dataset.emoji === d.emoji));
      okBtn.disabled = !nameIn.value.trim();
    };
    const ok = () => {
      const name = nameIn.value.trim(); if (!name) return;
      closeSheet();
      if (existing) {
        Object.assign(existing, { name, emoji: d.emoji, color: d.color });
        save(); render();
      } else {
        const l = mkList(name, d.emoji, d.color, [['', []]]);
        state.lists.push(l); save();
        location.hash = '#/l/' + l.id;
      }
    };
    sh.addEventListener('click', e => {
      const t = e.target.closest('button'); if (!t) return;
      if (t.dataset.color) d.color = t.dataset.color;
      else if (t.dataset.emoji) d.emoji = t.dataset.emoji;
      else if (t.dataset.x === 'cancel') return closeSheet();
      else if (t.dataset.x === 'ok') return ok();
      sync();
    });
    nameIn.addEventListener('input', sync);
    nameIn.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); nameIn.blur(); } });
    sync();
    if (!existing) nameIn.focus();
  }

  let toastTimer;
  function toast(msg, undoFn) {
    let t = document.querySelector('.toast');
    if (!t) { t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); }
    t.innerHTML = `<span>${esc(msg)}</span>${undoFn ? '<button>Annuler</button>' : ''}`;
    if (undoFn) t.querySelector('button').onclick = () => { t.classList.remove('show'); undoFn(); };
    requestAnimationFrame(() => t.classList.add('show'));
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 4500);
  }

  // ---------- Actions ----------
  function resetList(l) {
    const snapshot = JSON.stringify(l.sections);
    l.sections.forEach(s => s.items.forEach(i => { i.done = false; }));
    save(); render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    toast('Liste remise à zéro', () => { l.sections = JSON.parse(snapshot); save(); render(); });
  }

  function confirmReset(l) {
    const { done } = stats(l);
    if (!done) return toast('Rien à décocher 🙂');
    actionSheet(`Décocher les ${done} élément${done > 1 ? 's' : ''} de « ${l.name} » ?`, [
      { label: 'Réinitialiser la liste', e: '↺', primary: true, fn: () => resetList(l) },
    ]);
  }

  function addItem(l, secId, text, inputEl) {
    const s = l.sections.find(x => x.id === secId); if (!s) return;
    const it = { id: uid(), text, done: false };
    s.items.push(it); save();
    // insertion ciblée : le clavier reste ouvert pour enchaîner
    const addRow = inputEl.closest('.add-row');
    addRow.insertAdjacentHTML('beforebegin', itemHTML(l, s, it, s.items.length - 1));
    inputEl.value = '';
    const empty = app.querySelector('.empty'); if (empty) empty.remove();
    updateCounts(l);
  }

  function focusAdd(l, secId) {
    const s = l.sections.find(x => x.id === secId);
    if (s && s.collapsed) { s.collapsed = false; save(); render(); }
    const inp = app.querySelector(`.add-in[data-sec="${secId}"]`);
    if (inp) { inp.focus(); inp.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
  }

  function newSection(l) {
    promptSheet('Nouveau chapitre', 'ex. Repas, Dodo, Toilette…', '', title => {
      // si la liste n'a qu'un chapitre sans titre et vide, on le remplace
      if (l.sections.length === 1 && !l.sections[0].title && !l.sections[0].items.length) l.sections = [];
      const s = { id: uid(), title, collapsed: false, items: [] };
      l.sections.push(s); save(); render();
      focusAdd(l, s.id);
    });
  }

  function exportData() {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `listes-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }

  document.getElementById('importFile').addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return;
    f.text().then(txt => {
      const s = JSON.parse(txt);
      if (!s || !Array.isArray(s.lists)) throw new Error();
      state = s; save(); location.hash = ''; render(); toast('Listes restaurées');
    }).catch(() => toast('Fichier invalide'));
    e.target.value = '';
  });

  app.addEventListener('click', e => {
    const el = e.target.closest('[data-act]'); if (!el) return;
    const act = el.dataset.act;
    const l = getList(currentListId());
    const sec = l && l.sections.find(s => s.id === (el.dataset.sec || el.closest('[data-sec]')?.dataset.sec));
    const itemEl = el.closest('.item');
    const itemIdx = sec && itemEl ? sec.items.findIndex(i => i.id === itemEl.dataset.id) : -1;

    switch (act) {
      case 'open': ui.edit = false; location.hash = '#/l/' + el.dataset.id; break;
      case 'home': location.hash = ''; break;
      case 'home-menu':
        actionSheet('', [
          { label: 'Réorganiser les listes', e: '↕︎', fn: () => { ui.homeEdit = true; render(); } },
          { label: 'Sauvegarder (fichier)', e: '💾', fn: exportData },
          { label: 'Restaurer une sauvegarde', e: '📂', fn: () => document.getElementById('importFile').click() },
        ]);
        break;
      case 'home-edit-done': ui.homeEdit = false; render(); break;
      case 'list-up': move(state.lists, +el.dataset.i, -1); save(); render(); break;
      case 'list-down': move(state.lists, +el.dataset.i, 1); save(); render(); break;

      case 'toggle': {
        const it = sec.items[itemIdx];
        it.done = !it.done; save();
        el.classList.toggle('done', it.done);
        el.setAttribute('aria-checked', it.done);
        if (it.done && l.hideDone) {
          el.classList.add('just');
          setTimeout(() => el.classList.remove('just'), 900);
        }
        updateCounts(l);
        break;
      }
      case 'collapse': sec.collapsed = !sec.collapsed; save(); el.closest('.sec').classList.toggle('collapsed', sec.collapsed); break;
      case 'focus-add': if (e.target.tagName !== 'INPUT') el.querySelector('input').focus(); break;
      case 'reset': confirmReset(l); break;
      case 'edit': ui.edit = true; render(); break;
      case 'edit-done': if (document.activeElement) document.activeElement.blur(); ui.edit = false; render(); break;
      case 'list-menu':
        actionSheet('', [
          { label: 'Infos de la liste (nom, couleur…)', e: 'ℹ️', fn: () => listEditor(l) },
          { label: 'Modifier / réorganiser', e: '✏️', fn: () => { ui.edit = true; render(); } },
          { label: l.hideDone ? 'Afficher les éléments cochés' : 'Masquer les éléments cochés', e: l.hideDone ? '👁️' : '🙈',
            fn: () => { l.hideDone = !l.hideDone; save(); render(); } },
          { label: 'Tout déplier / replier', e: '↕︎', fn: () => {
              const anyOpen = l.sections.some(s => s.title && !s.collapsed);
              l.sections.forEach(s => { s.collapsed = anyOpen; }); save(); render(); } },
          { label: 'Dupliquer la liste', e: '📋', fn: () => {
              const c = JSON.parse(JSON.stringify(l));
              c.id = uid(); c.name = l.name + ' (copie)';
              c.sections.forEach(s => { s.id = uid(); s.items.forEach(i => { i.id = uid(); i.done = false; }); });
              state.lists.splice(state.lists.indexOf(l) + 1, 0, c); save();
              location.hash = '#/l/' + c.id; toast('Liste dupliquée');
            } },
          { label: 'Supprimer la liste', e: '🗑️', danger: true, fn: () => {
              actionSheet(`Supprimer « ${l.name} » définitivement ?`, [
                { label: 'Supprimer', danger: true, fn: () => {
                    const idx = state.lists.indexOf(l);
                    state.lists.splice(idx, 1); save(); location.hash = '';
                    toast('Liste supprimée', () => { state.lists.splice(idx, 0, l); save(); location.hash = '#/l/' + l.id; });
                  } },
              ]);
            } },
        ]);
        break;
      case 'new-item': {
        if (!l.sections.length) { l.sections.push({ id: uid(), title: '', collapsed: false, items: [] }); save(); render(); }
        focusAdd(l, l.sections[l.sections.length - 1].id);
        break;
      }
      case 'new-sec': newSection(l); break;
      case 'del-item': sec.items.splice(itemIdx, 1); save(); render(); break;
      case 'item-up': move(sec.items, itemIdx, -1); save(); render(); break;
      case 'item-down': move(sec.items, itemIdx, 1); save(); render(); break;
      case 'sec-up': move(l.sections, l.sections.indexOf(sec), -1); save(); render(); break;
      case 'sec-down': move(l.sections, l.sections.indexOf(sec), 1); save(); render(); break;
      case 'del-sec': {
        const doDel = () => { l.sections.splice(l.sections.indexOf(sec), 1); save(); render(); };
        if (!sec.items.length) doDel();
        else actionSheet(`Supprimer « ${sec.title || 'ce chapitre'} » et ses ${sec.items.length} élément${sec.items.length > 1 ? 's' : ''} ?`,
          [{ label: 'Supprimer le chapitre', danger: true, fn: doDel }]);
        break;
      }
    }
  });

  // Toolbar (hors de #app)
  document.body.addEventListener('click', e => {
    if (!tbEl || !tbEl.contains(e.target)) return;
    const el = e.target.closest('[data-act]'); if (!el) return;
    const l = getList(currentListId());
    if (el.dataset.act === 'new-list') listEditor(null);
    else if (el.dataset.act === 'new-item') {
      if (!l.sections.length) { l.sections.push({ id: uid(), title: '', collapsed: false, items: [] }); save(); render(); }
      focusAdd(l, l.sections[l.sections.length - 1].id);
    }
    else if (el.dataset.act === 'edit') { ui.edit = true; render(); }
    else if (el.dataset.act === 'edit-done') { if (document.activeElement) document.activeElement.blur(); ui.edit = false; render(); }
  });

  app.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const t = e.target;
    const l = getList(currentListId()); if (!l) return;
    if (t.classList.contains('add-in')) {
      e.preventDefault();
      const v = t.value.trim();
      if (v) addItem(l, t.dataset.sec, v, t); else t.blur();
    } else if (t.classList.contains('item-in') || t.classList.contains('sec-title-in')) {
      e.preventDefault(); t.blur();
    }
  });

  // Enregistre les modifications du mode édition
  app.addEventListener('change', e => {
    const t = e.target;
    const l = getList(currentListId()); if (!l) return;
    const s = l.sections.find(x => x.id === t.dataset.sec); if (!s) return;
    if (t.classList.contains('sec-title-in')) { s.title = t.value.trim(); save(); }
    else if (t.classList.contains('item-in')) {
      const it = s.items.find(i => i.id === t.dataset.id); if (!it) return;
      const v = t.value.trim();
      if (v) it.text = v; else t.value = it.text;
      save();
    }
  });
  // Ajoute ce qui a été tapé si on quitte le champ sans valider
  app.addEventListener('focusout', e => {
    const t = e.target;
    if (!t.classList || !t.classList.contains('add-in') || !t.value.trim()) return;
    const l = getList(currentListId()); if (!l) return;
    addItem(l, t.dataset.sec, t.value.trim(), t);
  });

  window.addEventListener('hashchange', () => { ui.edit = false; ui.homeEdit = false; closeSheet(true); render(); window.scrollTo(0, 0); });
  window.addEventListener('storage', e => { if (e.key === STORE_KEY) { state = load(); render(); } });

  render();
  save();

  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
